<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>primeira tabela</title>
    <style>
        table{
            height: 400px;
            width: 400px;
            border-collapse: collapse;
        }

        
        td{
            border: 1px solid black;
            padding: 8px;
            text-align:center;
            vertical-align: top;
        }

        .numero{
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>tabela</h1>
    <table>
        <tr id="destaque">
            <td>a1</td>
            <td>a2</td>
            <td>a3</td> 
            <td>a4</td>
        </tr>
        <tr>
            <td>b1</td>
            <td>b2</td>
            <td>b3</td>
            <td class="numero">b4</td>
        </tr>
        <tr>
            <td>c1</td>
            <td>c2</td>
            <td>c3</td>
            <td class="numero">c4</td>
        </tr>
    </table>
</body>
