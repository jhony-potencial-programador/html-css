<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascripts</title>
        <style>
        body{
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <a href="#" onclick="clicou()">clique em mim</a>
    <div id="saida">saida</div>

    <script>
        function clicou() {
            s = window.document.getElementById("saida")
            s.innerHTML += '<p>comeram meu bolo de morango</p>'
        }
    </script>
</body>
</html>
