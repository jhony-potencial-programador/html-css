<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo</title>
</head>
<body>
    <h1>gfdsafdsf fdsafds sa</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>dados pessoais</legend>
            <p>
                <label for="inome">nome</label>
                <input type="text" name="name" id="iname" required minlength="8" maxlength="30" placeholder="digite seu nome" autocomplete="name">
            </p>
            <p>
                <label for="iemail">e-mail</label>
                <input type="email" name="emal" id="iemail" required autocomplete="email">
            </p>
            <p>
                <label for="itel">teleone</label>
                <input type="tel" name="tel" id="itel" required autocomplete="tel">
            </p>
            <p>
                <input type="submit" value="enviar">
                <input type="reset" value="limpar">
            </p>
        </fieldset>
    </form>
</body>
</html>
