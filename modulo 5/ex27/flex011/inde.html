<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible box</title>
    <style>
        div.container{
            background-color: rgb(255, 159, 159);
            
            display: flex;
            flex-direction:row ;
            flex-wrap: nowrap;

            padding: 10px;
        }
        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 100px;
        }

        div#A{
            flex-shrink: 0;
            flex-grow: 1;
        }
        div#B{
            flex-shrink: 1;
            flex-grow: 0;
        }
        div#C{
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#D{
            flex-shrink: 0;
            flex-grow: 0;
        }
        div#E{
            flex-shrink: 2;
            flex-grow: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="A">A</div>
        <div class="item" id="B">B</div>
        <div class="item" id="C">C</div>
        <div class="item" id="D">D</div>
        <div class="item" id="E">E</div>
    </div>
</body>
</html>
