<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-layout</title>
    <style>
        .container{
            border: 2px dotted blue;
            height: 250px;
            display: grid;
            grid-template: repeat(3, auto) / repeat(3, auto);
            gap: 10px;

            place-items: start center;
            place-content: space-between end;
        }
        .iten{
            border: 2px solid red;

        }
    </style>
        
</head>
<body>
    <main class="container">
        <div class="iten iten1">1</div>
        <div class="iten iten2">2</div>
        <div class="iten iten3">3</div>
        <div class="iten iten4">4</div>
        <div class="iten iten5">5</div>
        <div class="iten iten6">6</div>
        <div class="iten iten7">7</div>
        <div class="iten iten8">8</div>
        <div class="iten iten9">9</div>

    </main>
</body>
</html>
